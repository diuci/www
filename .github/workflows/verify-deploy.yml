name: 校验线上部署

# 主站是 GitHub Pages 的 branch 部署模式（main 分支根目录直接发布），
# 因此推送即上线，本工作流不参与发布，只负责「推送之后自动验证确实是好的」。
#
# 为什么需要它：手工维护单文件首页时最容易出现两类静默故障 ——
#   1. 覆盖 index.html 时内容被截断或清空，线上出现残缺页面；
#   2. 误删误改 CNAME，导致 diuci.com 自定义域名失效（历史上发生过）。
# 这里在每次推送后自动拦住这两种情况。
#
# 注意：Cloudflare 会在 </body> 后注入 Analytics beacon，
# 线上 HTML 字节流必然与仓库不同，所以不能用哈希比对，只能核对关键锚点。

# 故意不设 paths 过滤：这个仓库里每个文件都与部署相关，
# 而且一旦过滤掉本工作流自身，改动校验逻辑时就无法被校验。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 保护 CNAME
        run: |
          set -euo pipefail
          if [ ! -f CNAME ]; then
            echo "::error::CNAME 不存在，diuci.com 自定义域名会立即失效"
            exit 1
          fi
          domain="$(tr -d '\r\n' < CNAME)"
          echo "CNAME = ${domain}"
          if [ "${domain}" != "diuci.com" ]; then
            echo "::error::CNAME 内容应为 diuci.com，实际为 ${domain}"
            exit 1
          fi

      - name: 确认 .nojekyll 存在
        run: |
          set -euo pipefail
          if [ ! -f .nojekyll ]; then
            echo "::error::缺少 .nojekyll，Pages 会启用 Jekyll 处理并可能丢弃下划线开头的文件"
            exit 1
          fi
          echo ".nojekyll 存在"

      - name: 法律护栏
        # 先证明检查器抓得住坏样本，再看它说「通过」值不值得信。
        run: |
          set -euo pipefail
          node tools/check-legal.mjs --selftest
          node tools/check-legal.mjs

      - name: 四站 UI 闸门
        # 令牌副本字节一致、顶栏两枚圆钮、繁简钮文案、说明页只在页脚、乐园顺序（规范 §1—§8）。
        run: |
          set -euo pipefail
          node tools/check-ui.mjs --selftest
          node tools/check-ui.mjs

      - name: 繁简字典闸门
        # 每一段页面文案都得有繁体译法；字典里不许留着页面找不到的死键；
        # 繁体侧不许出现只有简体才用的字。
        run: |
          set -euo pipefail
          node tools/check-hant.mjs --selftest
          node tools/check-hant.mjs

      - name: 校验仓库首页内容完整
        # 这一步只读仓库里的 index.html，不依赖网络，因此永远可靠。
        # 它能拦住「覆盖文件时内容被截断/清空」这类最危险的误操作。
        run: |
          set -euo pipefail
          anchors=(
            '<title>丢词夺理 · 学古诗，也玩古诗</title>'
            '丢词夺理'
            'class="dc-tabbar"'
            'https://k12.diuci.com/'
            'https://ink.diuci.com/'
            'https://moon.diuci.com/'
            'https://handle.diuci.com/'
            'https://lian.diuci.com/'
            'https://github.com/diuci/k12-chinese-poetry'
            ':root[data-theme="dark"]'
            '内容仓库'
            'https://k12.diuci.com/legal'
            '六 个 乐 园'
          )
          missing=0
          for a in "${anchors[@]}"; do
            if grep -qF -- "${a}" index.html; then
              echo "OK   ${a}"
            else
              echo "MISS ${a}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::仓库里的 index.html 缺少预期内容，疑似被截断或覆盖失败"
            exit 1
          fi
          echo "index.html 内容完整（$(wc -c < index.html) 字节）"

      - name: 抓取线上页面
        # 与内容核对拆开，是为了在排查时能一眼看出
        # 到底是「抓不到」还是「抓到了但内容不对」。
        env:
          SITE_URL: https://diuci.com/
        run: |
          set -uo pipefail
          # 用浏览器 UA：Cloudflare 会对 curl 默认 UA 做拦截，
          # 返回人机校验页而不是真实内容。
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          # branch 模式下「推送即上线」，但 Pages 的构建与分发是异步的：
          # 校验跑在部署之前，就会拿旧页面核对新锚点而失败。
          # 2026-10-06 加汉兜入口那次就是这么红的：仓库对、线上也对，只是校验抢跑了。
          # 所以先等 45 秒，再把重试从 8×20s 放宽到 16×30s（最长约 8 分钟）。
          sleep 45
          code=000
          for attempt in $(seq 1 16); do
            code="$(curl -sSL -A "${UA}" \
              -H 'Accept: text/html,application/xhtml+xml' \
              -H 'Accept-Language: zh-CN,zh;q=0.9' \
              --max-time 30 -o live.html -w '%{http_code}' \
              "${SITE_URL}?verify=${GITHUB_SHA}-${attempt}" || true)"
            size="$(wc -c < live.html 2>/dev/null || echo 0)"
            echo "第 ${attempt} 次：HTTP ${code}，${size} 字节"
            if [ "${code}" = "200" ] && [ "${size}" -gt 0 ]; then
              break
            fi
            sleep 30
          done
          if [ "${code}" != "200" ] || [ ! -s live.html ]; then
            echo "::error::无法从 CI 抓取 ${SITE_URL}（最后一次 HTTP ${code}），请确认 Pages 与 Cloudflare 状态"
            exit 1
          fi
          if grep -qiE 'cf-chl|Just a moment|Attention Required|Enable JavaScript and cookies' live.html; then
            echo "::error::抓到的是 Cloudflare 人机校验页，不是站点内容"
            exit 1
          fi

      - name: 核对线上内容与仓库一致
        run: |
          set -euo pipefail
          anchors=(
            '<title>丢词夺理 · 学古诗，也玩古诗</title>'
            '丢词夺理'
            'class="dc-tabbar"'
            'https://k12.diuci.com/'
            'https://ink.diuci.com/'
            'https://moon.diuci.com/'
            'https://handle.diuci.com/'
            'https://lian.diuci.com/'
            'https://github.com/diuci/k12-chinese-poetry'
            ':root[data-theme="dark"]'
            '内容仓库'
            'https://k12.diuci.com/legal'
            '六 个 乐 园'
          )
          missing=0
          for a in "${anchors[@]}"; do
            if grep -qF -- "${a}" live.html; then
              echo "OK   ${a}"
            else
              echo "MISS ${a}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::线上页面与仓库不一致，本次推送可能未生效"
            exit 1
          fi
          echo "线上页面与仓库一致，diuci.com 部署正常"